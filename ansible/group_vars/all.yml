---
# Socle commun
common_timezone: "Europe/Zurich"
common_packages:
  - ca-certificates
  - curl
  - htop
  - unattended-upgrades
  - vim

# Supervision sécurité : enrôlement automatique dans le SIEM Wazuh du homelab
wazuh_enabled: true
wazuh_agent_manager: "wazuh.micronet-info.com"
# Doit rester ≤ à la version du manager (4.14.5) : l'agent est ensuite bloqué (hold).
wazuh_agent_version: "4.14.5-1"
