[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = root
interpreter_python = auto_silent
# Lab : les conteneurs sont recréés souvent, leurs clés d'hôte changent.
# En production : known_hosts géré (ssh-keyscan dans le pipeline ou CA SSH).
host_key_checking = False

[ssh_connection]
pipelining = True
